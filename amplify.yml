version: 1
frontend:
  phases:
    build:
      commands:
        - echo "ADP — Ateliers de Paul — build statique"
  artifacts:
    baseDirectory: /
    files:
      - 'index.html'
      - 'adp-shared.css'
      - 'adp-shared.js'
      - 'adp-home.css'
      - 'adp-pole.css'
      - 'legal.css'
      - 'assets/**/*'
      - 'adp/**/*'
      - 'adp-tools/**/*'
      - 'adp-studio/**/*'
      - 'adp-brief/**/*'
      - 'adp-academy/**/*'
      - 'adp-lab/**/*'
      - 'portfolio/**/*'
      - 'projects/**/*'
      - 'a-propos/**/*'
      - 'contact/**/*'
      - 'ressources/**/*'
      - 'cadre-deontologique/**/*'
      - 'mentions-legales/**/*'
      - 'politique-confidentialite/**/*'
      - 'CNAME'
      - '.nojekyll'
      - 'sitemap.xml'
      - 'robots.txt'
  cache:
    paths: []
customHeaders:
  - pattern: '**/*.{css,js}'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.{png,jpg,jpeg,svg,webp,ico}'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
redirects:
  - source: '/projects/<slug>'
    target: '/portfolio/<slug>/'
    status: '301'
  - source: '/<page>'
    target: '/<page>/index.html'
    status: '200'