<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Message envoyé | Ateliers de Paul</title>
    <link rel="canonical" href="https://ateliersdepaul.com/contact/merci/">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="/adp-shared.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-89V1WZL52D"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-89V1WZL52D');</script>
    <style>
        .merci-section {
            min-height: calc(100vh - var(--adp-nav-height));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--adp-nav-height) + 4rem) 1.5rem 4rem;
            background: var(--adp-surface);
        }
        .merci-card {
            max-width: 520px;
            width: 100%;
            background: var(--adp-white);
            border: 1px solid var(--adp-border);
            border-radius: var(--adp-radius-xl);
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: var(--adp-shadow-md);
        }
        .merci-icon {
            width: 64px;
            height: 64px;
            background: rgba(30,115,216,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.75rem;
            font-size: 1.5rem;
            color: var(--adp-blue);
        }
        .merci-card h1 {
            font-family: var(--adp-font-heading);
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 800;
            color: var(--adp-black);
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }
        .merci-card p {
            font-size: 0.95rem;
            color: var(--adp-gray-text);
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .merci-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="adp-cursor"></div>
    <div class="adp-cursor-follower"></div>
    <a href="#main-content" class="skip-link">Aller au contenu</a>

    <header class="adp-navbar">
        <div class="adp-container">
            <a href="/" class="adp-logo">
                <img src="/assets/logo-adp.png" alt="ADP — Ateliers de Paul" class="adp-logo-img">
            </a>
            <nav class="adp-nav-links">
                <a href="/" class="adp-nav-item">Accueil</a>
                <div class="adp-nav-dropdown">
                    <span class="adp-nav-item">ADP</span>
                    <div class="adp-dropdown-menu">
                        <a href="/adp-tools/" class="adp-dropdown-item"><span class="di-icon"><i class="fas fa-tools"></i></span>ADP Tools</a>
                        <a href="/adp-studio/" class="adp-dropdown-item"><span class="di-icon"><i class="fas fa-pencil-ruler"></i></span>ADP Studio</a>
                        <a href="/adp-brief/" class="adp-dropdown-item"><span class="di-icon"><i class="fas fa-file-alt"></i></span>ADP Brief</a>
                        <a href="/adp-academy/" class="adp-dropdown-item"><span class="di-icon"><i class="fas fa-graduation-cap"></i></span>ADP Academy</a>
                        <a href="/adp-lab/" class="adp-dropdown-item"><span class="di-icon"><i class="fas fa-flask"></i></span>ADP Lab</a>
                    </div>
                </div>
                <a href="/portfolio/" class="adp-nav-item">Portfolio</a>
                <a href="/ressources/" class="adp-nav-item">Ressources</a>
                <a href="/a-propos/" class="adp-nav-item">À propos</a>
                <a href="/contact/" class="adp-nav-item active">Contact</a>
            </nav>
            <a href="/contact/" class="btn-primary adp-nav-cta">Nous contacter &rarr;</a>
            <button class="adp-menu-toggle" aria-label="Menu" aria-expanded="false">
                <div class="adp-hamburger"><span></span><span></span></div>
            </button>
        </div>
    </header>

    <main id="main-content">
        <section class="merci-section">
            <div class="merci-card">
                <div class="merci-icon">
                    <i class="fas fa-check"></i>
                </div>
                <h1>Message envoyé !</h1>
                <p>Merci pour votre message. Nous l'avons bien reçu et vous répondrons sous <strong>48h ouvrées</strong>.</p>
                <div class="merci-actions">
                    <a href="/" class="btn-primary">Retour à l'accueil <i class="fas fa-arrow-right"></i></a>
                    <a href="/portfolio/" class="btn-outline">Voir le portfolio</a>
                </div>
            </div>
        </section>
    </main>

    <script src="/adp-shared.js"></script>
</body>
</html>
